<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=components/index.html">
    <title>Redirecting to Components Library...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            background: #F8FAFC;
        }
        .redirect-box {
            text-align: center;
            padding: 3rem;
        }
        .redirect-box h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .redirect-box p {
            color: #64748B;
            margin-bottom: 1.5rem;
        }
        .redirect-box a {
            color: #4F46E5;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #E2E8F0;
            border-top-color: #4F46E5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h1>Redirecting to Components Library</h1>
        <p>Please wait, or <a href="components/index.html">click here</a> if not redirected.</p>
    </div>
</body>
</html>
