<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Two-factor authentication">
    <title>Two-Factor Authentication | Smart Workz</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../../../dist/img/favicon.png">

    <!-- CSS - CDN Fallback -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        :root { --primary: #4F46E5; --primary-dark: #4338CA; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .auth-page { min-height: 100vh; background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .auth-card { background: #fff; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.1); padding: 3rem; max-width: 450px; width: 100%; }
        .auth-form__header { text-align: center; margin-bottom: 2rem; }
        .auth-form__icon { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem; }
        .auth-form__title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .auth-form__subtitle { color: #64748B; }
        .otp-inputs { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 2rem; }
        .otp-input { width: 50px; height: 60px; text-align: center; font-size: 1.5rem; font-weight: 700; border: 2px solid #E2E8F0; border-radius: 0.5rem; }
        .otp-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        .btn-primary { background: var(--primary); border-color: var(--primary); padding: 0.75rem 1.5rem; font-weight: 600; }
        .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
        .auth-form__footer { text-align: center; margin-top: 2rem; color: #64748B; }
        .auth-form__footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body class="auth-page">
    <!-- Skip to main content (accessibility) -->
    <a href="#main-content" class="sr-only sr-only-focusable">Skip to main content</a>

    <div class="page-centered">
        <main id="main-content" class="auth-form auth-form--centered">
            <!-- Logo -->
            <div class="auth-form__logo">
                <i class="bi bi-hexagon-fill"></i>
                <span>Smart Workz</span>
            </div>

            <!-- Icon -->
            <div class="auth-form__icon auth-form__icon--primary">
                <i class="bi bi-shield-check"></i>
            </div>

            <div class="auth-form__header">
                <h2 class="auth-form__title">Two-factor authentication</h2>
                <p class="auth-form__subtitle">
                    Enter the 6-digit code from your authenticator app to continue.
                </p>
            </div>

            <!-- 2FA Form -->
            <form class="auth-form__body" action="#" method="POST">
                <!-- OTP Input -->
                <div class="form-group">
                    <label for="otp1" class="form-label visually-hidden">Verification code</label>
                    <div class="otp-input" role="group" aria-label="6-digit verification code">
                        <input 
                            type="text" 
                            class="otp-input__field" 
                            id="otp1"
                            maxlength="1" 
                            pattern="[0-9]" 
                            inputmode="numeric"
                            autocomplete="one-time-code"
                            required
                            aria-label="Digit 1"
                        >
                        <input 
                            type="text" 
                            class="otp-input__field" 
                            id="otp2"
                            maxlength="1" 
                            pattern="[0-9]" 
                            inputmode="numeric"
                            required
                            aria-label="Digit 2"
                        >
                        <input 
                            type="text" 
                            class="otp-input__field" 
                            id="otp3"
                            maxlength="1" 
                            pattern="[0-9]" 
                            inputmode="numeric"
                            required
                            aria-label="Digit 3"
                        >
                        <span class="otp-input__separator">-</span>
                        <input 
                            type="text" 
                            class="otp-input__field" 
                            id="otp4"
                            maxlength="1" 
                            pattern="[0-9]" 
                            inputmode="numeric"
                            required
                            aria-label="Digit 4"
                        >
                        <input 
                            type="text" 
                            class="otp-input__field" 
                            id="otp5"
                            maxlength="1" 
                            pattern="[0-9]" 
                            inputmode="numeric"
                            required
                            aria-label="Digit 5"
                        >
                        <input 
                            type="text" 
                            class="otp-input__field" 
                            id="otp6"
                            maxlength="1" 
                            pattern="[0-9]" 
                            inputmode="numeric"
                            required
                            aria-label="Digit 6"
                        >
                    </div>
                    <!-- Hidden input for full OTP value -->
                    <input type="hidden" name="otp" id="otpValue">
                </div>

                <!-- Trust Device -->
                <div class="form-group">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="trustDevice" name="trustDevice">
                        <label class="form-check-label" for="trustDevice">
                            Trust this device for 30 days
                        </label>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-block">
                        Verify
                    </button>
                </div>
            </form>

            <!-- Alternative Options -->
            <div class="auth-form__alternatives">
                <p class="auth-form__alternatives-text">Having trouble?</p>
                <div class="auth-form__alternatives-links">
                    <a href="#" class="auth-form__link">
                        <i class="bi bi-phone"></i>
                        Use SMS instead
                    </a>
                    <a href="#" class="auth-form__link">
                        <i class="bi bi-key"></i>
                        Use backup code
                    </a>
                </div>
            </div>

            <!-- Back to Login -->
            <div class="auth-form__footer">
                <a href="login.html" class="auth-form__back">
                    <i class="bi bi-arrow-left"></i>
                    Back to sign in
                </a>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer-minimal">
        <p class="footer-minimal__copyright">
            &copy; 2025 Smart Workz. All rights reserved.
        </p>
    </footer>

    <!-- JavaScript -->
    <script src="../../../dist/js/vendor.min.js"></script>
    <script src="../../../dist/js/app.min.js"></script>
    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 50 });</script>
</body>
</html>
