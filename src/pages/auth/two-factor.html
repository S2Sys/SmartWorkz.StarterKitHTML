<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Two-factor authentication">
    <title>Two-Factor Authentication | Smart Workz</title>
    <link rel="icon" type="image/png" href="../../../dist/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --primary: #4F46E5; --primary-dark: #4338CA; --primary-light: #EEF2FF; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; 
            min-height: 100vh;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            display: flex;
            flex-direction: column;
        }
        
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .auth-card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 3rem;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        
        .auth-card__icon {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
        
        .auth-card__title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1E293B;
            margin: 0 0 0.75rem;
        }
        
        .auth-card__subtitle {
            color: #64748B;
            margin: 0 0 2rem;
            font-size: 0.9375rem;
            line-height: 1.6;
        }
        
        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        
        .otp-input {
            width: 56px;
            height: 64px;
            border: 2px solid #E2E8F0;
            border-radius: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            transition: all 0.2s;
        }
        
        .otp-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: var(--primary);
            border: none;
            border-radius: 0.5rem;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: transparent;
            border: 1px solid #E2E8F0;
            border-radius: 0.5rem;
            color: #64748B;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-outline:hover { background: #F8FAFC; border-color: #CBD5E1; }
        
        .auth-methods {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #E2E8F0;
        }
        
        .auth-methods__title {
            font-size: 0.8125rem;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        
        .auth-method {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border: 1px solid #E2E8F0;
            border-radius: 0.75rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        
        .auth-method:hover { border-color: var(--primary); background: var(--primary-light); }
        
        .auth-method__icon {
            width: 44px;
            height: 44px;
            border-radius: 0.5rem;
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #64748B;
        }
        
        .auth-method__info { flex: 1; }
        
        .auth-method__name {
            font-weight: 600;
            color: #1E293B;
            font-size: 0.9375rem;
            margin-bottom: 0.125rem;
        }
        
        .auth-method__desc {
            color: #64748B;
            font-size: 0.8125rem;
        }
        
        .auth-card__footer {
            margin-top: 2rem;
        }
        
        .auth-card__link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748B;
            text-decoration: none;
            font-size: 0.875rem;
        }
        
        .auth-card__link:hover { color: var(--primary); }
        
        .footer-minimal {
            padding: 1.5rem 2rem;
            text-align: center;
        }
        
        .footer-minimal__copyright {
            margin: 0;
            color: #64748B;
            font-size: 0.8125rem;
        }
        
        @media (max-width: 576px) {
            .auth-card { padding: 2rem 1.5rem; border-radius: 1rem; }
            .otp-input { width: 48px; height: 56px; font-size: 1.25rem; }
            .otp-inputs { gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" data-aos="fade-up" data-aos-duration="600">
            <div class="auth-card__icon">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1 class="auth-card__title">Two-Factor Authentication</h1>
            <p class="auth-card__subtitle">
                Enter the 6-digit code from your authenticator app to continue.
            </p>
            
            <form action="#" method="POST">
                <div class="otp-inputs">
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                    <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                </div>
                
                <button type="submit" class="btn-primary">
                    Verify Code
                    <i class="bi bi-arrow-right"></i>
                </button>
                
                <button type="button" class="btn-outline">
                    <i class="bi bi-arrow-clockwise"></i>
                    Use Recovery Code
                </button>
            </form>
            
            <div class="auth-methods">
                <p class="auth-methods__title">Other verification methods</p>
                <div class="auth-method">
                    <div class="auth-method__icon"><i class="bi bi-phone"></i></div>
                    <div class="auth-method__info">
                        <div class="auth-method__name">Text Message</div>
                        <div class="auth-method__desc">Send code to •••• 4589</div>
                    </div>
                    <i class="bi bi-chevron-right" style="color: #94A3B8;"></i>
                </div>
                <div class="auth-method">
                    <div class="auth-method__icon"><i class="bi bi-envelope"></i></div>
                    <div class="auth-method__info">
                        <div class="auth-method__name">Email</div>
                        <div class="auth-method__desc">Send code to j••••@company.com</div>
                    </div>
                    <i class="bi bi-chevron-right" style="color: #94A3B8;"></i>
                </div>
            </div>
            
            <div class="auth-card__footer">
                <a href="login.html" class="auth-card__link">
                    <i class="bi bi-arrow-left"></i>
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>
    
    <footer class="footer-minimal">
        <p class="footer-minimal__copyright">&copy; 2025 Smart Workz. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, easing: 'ease-out-cubic', once: true });
        
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
