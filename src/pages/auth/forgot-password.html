<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Smart Workz password">
    <title>Forgot Password | Smart Workz</title>
    <link rel="icon" type="image/png" href="../../../dist/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --primary: #4F46E5; --primary-dark: #4338CA; --primary-light: #EEF2FF; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            margin: 0; 
            min-height: 100vh;
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            display: flex;
            flex-direction: column;
        }
        
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .auth-card {
            background: #fff;
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 3rem;
            width: 100%;
            max-width: 440px;
        }
        
        .auth-card__icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }
        
        .auth-card__title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1E293B;
            text-align: center;
            margin: 0 0 0.5rem;
        }
        
        .auth-card__subtitle {
            color: #64748B;
            text-align: center;
            margin: 0 0 2rem;
            font-size: 0.9375rem;
            line-height: 1.6;
        }
        
        .form-group { margin-bottom: 1.25rem; }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 0.5rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1px solid #E2E8F0;
            border-radius: 0.5rem;
            font-size: 0.9375rem;
            transition: all 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: var(--primary);
            border: none;
            border-radius: 0.5rem;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary:hover { background: var(--primary-dark); }
        
        .auth-card__footer {
            margin-top: 2rem;
            text-align: center;
        }
        
        .auth-card__link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9375rem;
        }
        
        .auth-card__link:hover { text-decoration: underline; }
        
        .footer-minimal {
            padding: 1.5rem 2rem;
            text-align: center;
        }
        
        .footer-minimal__copyright {
            margin: 0;
            color: #64748B;
            font-size: 0.8125rem;
        }
        
        @media (max-width: 576px) {
            .auth-card { padding: 2rem 1.5rem; border-radius: 1rem; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" data-aos="fade-up" data-aos-duration="600">
            <div class="auth-card__icon">
                <i class="bi bi-key"></i>
            </div>
            <h1 class="auth-card__title">Forgot Password?</h1>
            <p class="auth-card__subtitle">
                No worries! Enter your email address and we'll send you a link to reset your password.
            </p>
            
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="name@company.com" required>
                </div>
                
                <button type="submit" class="btn-primary">
                    Send Reset Link
                    <i class="bi bi-arrow-right"></i>
                </button>
            </form>
            
            <div class="auth-card__footer">
                <a href="login.html" class="auth-card__link">
                    <i class="bi bi-arrow-left"></i>
                    Back to Sign In
                </a>
            </div>
        </div>
    </div>
    
    <footer class="footer-minimal">
        <p class="footer-minimal__copyright">&copy; 2025 Smart Workz. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 600, easing: 'ease-out-cubic', once: true });</script>
</body>
</html>
