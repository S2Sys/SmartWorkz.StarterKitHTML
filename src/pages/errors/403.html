<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Access Forbidden - 403 Error">
    <title>403 - Forbidden | Smart Workz</title>
    <link rel="icon" type="image/png" href="../../../dist/img/favicon.png">
    <!-- CSS - CDN Fallback -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #4F46E5; --danger: #EF4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%); padding: 2rem; }
        .error-content { text-align: center; max-width: 500px; }
        .error-icon { width: 120px; height: 120px; border-radius: 50%; background: var(--danger); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 2rem; }
        .error-code { font-size: 4rem; font-weight: 900; color: var(--danger); margin-bottom: 0.5rem; }
        .error-title { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
        .error-message { color: #64748B; font-size: 1.125rem; margin-bottom: 2rem; }
        .btn-primary { background: var(--primary); border-color: var(--primary); padding: 0.75rem 2rem; font-weight: 600; }
    </style>
</head>
<body class="error-page">
    <div class="error-container">
        <div class="error-content">
            <div class="error-code error-code--warning">403</div>
            <div class="error-illustration error-illustration--warning">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h1 class="error-title">Access Forbidden</h1>
            <p class="error-message">
                You don't have permission to access this page.
                Please contact your administrator if you believe this is an error.
            </p>
            <div class="error-actions">
                <a href="../dashboard/index.html" class="btn btn-primary">
                    <i class="bi bi-house"></i> Back to Dashboard
                </a>
                <a href="../auth/login.html" class="btn btn-outline-secondary">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </a>
            </div>
            <div class="error-help">
                <p>Think this is a mistake? <a href="#">Request Access</a></p>
            </div>
        </div>
    </div>
    <script src="../../../dist/js/vendor.min.js"></script>
    <script src="../../../dist/js/app.min.js"></script>
    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 50 });</script>
</body>
</html>
