<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site Under Maintenance">
    <title>Maintenance Mode | Smart Workz</title>
    <link rel="icon" type="image/png" href="../../../dist/img/favicon.png">
    <!-- CSS - CDN Fallback -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #4F46E5; --warning: #F59E0B; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .maintenance-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%); padding: 2rem; }
        .maintenance-content { text-align: center; max-width: 600px; }
        .maintenance-icon { width: 120px; height: 120px; border-radius: 50%; background: var(--warning); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 2rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .maintenance-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
        .maintenance-message { color: #64748B; font-size: 1.125rem; margin-bottom: 2rem; }
        .countdown { display: flex; justify-content: center; gap: 1.5rem; margin-bottom: 2rem; }
        .countdown-item { text-align: center; }
        .countdown-value { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        .countdown-label { font-size: 0.875rem; color: #64748B; }
    </style>
</head>
<body class="error-page">
    <div class="error-container">
        <div class="error-content">
            <div class="error-illustration error-illustration--info error-illustration--large">
                <i class="bi bi-gear"></i>
            </div>
            <h1 class="error-title">Under Maintenance</h1>
            <p class="error-message">
                We're performing scheduled maintenance to improve your experience.
                We'll be back online shortly.
            </p>
            
            <!-- Countdown Timer -->
            <div class="maintenance-countdown">
                <div class="countdown-item">
                    <span class="countdown-value" id="hours">02</span>
                    <span class="countdown-label">Hours</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <span class="countdown-value" id="minutes">30</span>
                    <span class="countdown-label">Minutes</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <span class="countdown-value" id="seconds">00</span>
                    <span class="countdown-label">Seconds</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="maintenance-progress">
                <div class="progress">
                    <div class="progress__bar" style="width: 65%;"></div>
                </div>
                <p class="maintenance-progress__text">Estimated: 65% complete</p>
            </div>

            <!-- Subscribe for Updates -->
            <div class="maintenance-notify">
                <p>Get notified when we're back online:</p>
                <form class="maintenance-notify__form">
                    <input type="email" class="form-control" placeholder="Enter your email">
                    <button type="submit" class="btn btn-primary">Notify Me</button>
                </form>
            </div>

            <!-- Social Links -->
            <div class="error-social">
                <p>Follow us for updates:</p>
                <div class="error-social__links">
                    <a href="#" class="btn btn-icon btn-outline-secondary"><i class="bi bi-twitter-x"></i></a>
                    <a href="#" class="btn btn-icon btn-outline-secondary"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="btn btn-icon btn-outline-secondary"><i class="bi bi-linkedin"></i></a>
                </div>
            </div>
        </div>
    </div>
    <script src="../../../dist/js/vendor.min.js"></script>
    <script src="../../../dist/js/app.min.js"></script>
    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 50 });</script>
</body>
</html>
