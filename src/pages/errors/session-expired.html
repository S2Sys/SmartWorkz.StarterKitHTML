<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Session Expired">
    <title>Session Expired | Smart Workz</title>
    <link rel="icon" type="image/png" href="../../../dist/img/favicon.png">
    <!-- CSS - CDN Fallback -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #4F46E5; --warning: #F59E0B; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .session-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); padding: 2rem; }
        .session-content { text-align: center; max-width: 450px; background: #fff; padding: 3rem; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .session-icon { width: 100px; height: 100px; border-radius: 50%; background: #FEF3C7; color: var(--warning); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem; }
        .session-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; }
        .session-message { color: #64748B; margin-bottom: 2rem; }
        .btn-primary { background: var(--primary); border-color: var(--primary); padding: 0.75rem 2rem; font-weight: 600; width: 100%; }
    </style>
</head>
<body class="error-page">
    <div class="error-container">
        <div class="error-content">
            <div class="error-illustration error-illustration--warning">
                <i class="bi bi-clock-history"></i>
            </div>
            <h1 class="error-title">Session Expired</h1>
            <p class="error-message">
                Your session has expired due to inactivity. 
                Please sign in again to continue where you left off.
            </p>
            <div class="error-actions">
                <a href="../auth/login.html" class="btn btn-primary btn-lg">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In Again
                </a>
            </div>
            <div class="session-info">
                <p><i class="bi bi-info-circle"></i> For your security, sessions expire after 30 minutes of inactivity.</p>
            </div>
        </div>
    </div>
    <script src="../../../dist/js/vendor.min.js"></script>
    <script src="../../../dist/js/app.min.js"></script>
    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 50 });</script>
</body>
</html>
