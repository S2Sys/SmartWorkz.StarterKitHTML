<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page Not Found - 404 Error">
    <title>404 - Page Not Found | Smart Workz</title>
    <link rel="icon" type="image/png" href="../../../dist/img/favicon.png">
    <!-- CSS - CDN Fallback -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary: #4F46E5; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); padding: 2rem; }
        .error-content { text-align: center; max-width: 500px; }
        .error-code { font-size: 8rem; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 1rem; }
        .error-title { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
        .error-message { color: #64748B; font-size: 1.125rem; margin-bottom: 2rem; }
        .btn-primary { background: var(--primary); border-color: var(--primary); padding: 0.75rem 2rem; font-weight: 600; }
    </style>
</head>
<body class="error-page">
    <div class="error-container">
        <div class="error-content">
            <div class="error-code">404</div>
            <div class="error-illustration">
                <i class="bi bi-search"></i>
            </div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                Oops! The page you're looking for doesn't exist or has been moved.
                Let's get you back on track.
            </p>
            <div class="error-actions">
                <a href="../dashboard/index.html" class="btn btn-primary">
                    <i class="bi bi-house"></i> Back to Dashboard
                </a>
                <button onclick="history.back()" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Go Back
                </button>
            </div>
            <div class="error-help">
                <p>Need help? <a href="#">Contact Support</a></p>
            </div>
        </div>
    </div>
    <script src="../../../dist/js/vendor.min.js"></script>
    <script src="../../../dist/js/app.min.js"></script>
    <!-- AOS Animation Library -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, easing: 'ease-out-cubic', once: true, offset: 50 });</script>
</body>
</html>
